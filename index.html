<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b5e9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ryder's Pup Pad</title>
<style>
:root{--pattern-size:256px;--pattern-opacity:.14;--swipe-duration:340ms;--swipe-ease:cubic-bezier(.17,.78,.21,1)}
*{box-sizing:border-box}
/* iOS standalone + black-translucent can size 100% to the safe viewport. */
html,body{margin:0;width:100%;height:100vh;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#092e54}
body{font-family:system-ui,-apple-system,sans-serif;background:transparent}
/* iPadOS standalone may reserve a lower safe-area strip outside the fixed viewport.
   Give the document canvas the current page's palette rather than exposing the old blue body. */
html{
 /* The root canvas also paints the tablet's area below the fixed viewport.
    Two hard-edged colors follow adjacent panels during an active swipe. */
 --bleed-left:#092d52;
 --bleed-right:#092d52;
 --bleed-split:100%;
 --bleed-pattern-x:0px;
 --bleed-pattern-y:0px;
 background-image:
  radial-gradient(ellipse at 50% 44%,rgba(255,255,255,.19) 0%,transparent 35%,rgba(0,0,0,.12) 68%,rgba(0,9,28,.55) 100%),
  url("assets/pattern-dog-bones.png"),
  linear-gradient(to right,var(--bleed-left) 0%,var(--bleed-left) var(--bleed-split),var(--bleed-right) var(--bleed-split),var(--bleed-right) 100%);
 background-size:100% 100%,var(--pattern-size) var(--pattern-size),100% 100%;
 background-repeat:no-repeat,repeat,no-repeat;
 background-position:center center,var(--bleed-pattern-x) var(--bleed-pattern-y),center center;
 background-blend-mode:normal,soft-light,normal;
 background-color:var(--bleed-left);
}
.screen{position:fixed;inset:0;overflow:hidden}
/* Overscan the bottom on landscape tablets; fall back to the synchronized
   document background if WebKit clips fixed elements to the safe viewport. */
@media (min-width:980px) and (orientation:landscape){
 #home,#app,#character-overlay{bottom:-54px}
}
@media (min-width:700px) and (orientation:portrait){
 #rotate{bottom:-54px}
}
.hidden{display:none!important}
#home{--edge-color:#092d52;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#409acb 0%,#1b71ae 36%,#0c477c 78%,#092d52 100%);isolation:isolate}
#home::before,.slide::before{content:"";position:absolute;inset:-10%;pointer-events:none;background:url("assets/pattern-dog-bones.png") repeat;background-size:var(--pattern-size) var(--pattern-size);opacity:var(--pattern-opacity)}
/* Blend the clipped viewport into the tablet's lower root-color safe area.
   On iPadOS the OS may display only background-color outside the CSS viewport;
   let pattern and vignette fade naturally to that same color before the edge. */
#home::after,.slide::after{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:
  linear-gradient(to bottom,transparent 76%,var(--edge-color) 90%,var(--edge-color) 100%),
  radial-gradient(ellipse at 50% 44%,rgba(255,255,255,.19) 0%,transparent 35%,rgba(0,0,0,.12) 68%,rgba(0,9,28,.55) 100%);
}
#start{appearance:none;position:relative;z-index:1;display:grid;place-items:center;width:min(55vw,78vh,510px);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;transition:transform 130ms ease,filter 130ms ease}
#start img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,10,30,.43)) drop-shadow(0 0 18px rgba(130,220,255,.45))}
#start:active,#start.pressed{transform:scale(.89);filter:brightness(1.22)}
#app{background:transparent}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#track{position:absolute;top:0;left:0;height:100%;display:flex;will-change:transform;transform:translate3d(0,0,0)}
.slide{--edge-color:var(--dark);position:relative;isolation:isolate;display:grid;place-items:center;width:100vw;flex:0 0 100vw;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--light),var(--base) 50%,var(--dark))}
.slide::after{z-index:1}
.badge-trigger{appearance:none;position:relative;z-index:2;display:grid;place-items:center;width:min(33vw,48vh,305px);aspect-ratio:1;border:0;padding:0;background:transparent;cursor:pointer;touch-action:none;transition:transform 135ms ease,filter 135ms ease}
.badge-trigger img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 12px 24px rgba(0,0,0,.28))}
.badge-trigger.pressed,.badge-trigger:active{transform:scale(.89);filter:brightness(1.2) drop-shadow(0 0 16px rgba(255,255,255,.36))}
.badge-trigger:focus-visible{outline:3px solid #fff;border-radius:24px}
.badge-trigger.preview-hidden img{visibility:hidden}
#character-overlay{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.76);overflow:hidden}
@media (min-width:980px) and (orientation:landscape){#character-overlay{bottom:-54px}}
#close-character{position:absolute;inset:0;display:grid;place-items:center;width:100%;height:100%;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}
/* Match the preview's center to the clicked badge center. The source PNG
   includes its own shield and extends below it, so compensate optically. */
#character-image{
 --badge-dx:0px;--badge-dy:0px;
 display:block;width:min(56vw,80vh,620px);height:min(80vh,620px);
 object-fit:contain;pointer-events:none;
 filter:drop-shadow(0 15px 25px rgba(0,0,0,.45));
 animation:character-appear 240ms ease-out both;
}
@keyframes character-appear{
 from{opacity:.45;transform:translate(var(--badge-dx),calc(var(--badge-dy) - 3vh)) scale(.88)}
 to{opacity:1;transform:translate(var(--badge-dx),calc(var(--badge-dy) - 3vh)) scale(.95)}
}
html.character-open{
 /* iPadOS may use the root solid color for the exposed lower strip. */
 background-color:color-mix(in srgb,var(--bleed-left) 24%,black);
 background-image:
  linear-gradient(rgba(0,0,0,.76),rgba(0,0,0,.76)),
  radial-gradient(ellipse at 50% 44%,rgba(255,255,255,.19) 0%,transparent 35%,rgba(0,0,0,.12) 68%,rgba(0,9,28,.55) 100%),
  url("assets/pattern-dog-bones.png"),
  linear-gradient(to right,var(--bleed-left) 0%,var(--bleed-left) var(--bleed-split),var(--bleed-right) var(--bleed-split),var(--bleed-right) 100%);
 background-size:100% 100%,100% 100%,var(--pattern-size) var(--pattern-size),100% 100%;
 background-repeat:no-repeat,no-repeat,repeat,no-repeat;
 background-position:center center,center center,var(--bleed-pattern-x) var(--bleed-pattern-y),center center;
 background-blend-mode:normal,normal,soft-light,normal;
}
#rotate{display:none;position:fixed;inset:0;z-index:20;place-items:center;background:linear-gradient(160deg,#236ca5,#082c50);text-align:center;color:white;font-size:20px;padding:25px}
#rotate>div{padding:25px;border-radius:24px;background:rgba(255,255,255,.13)}
@media (orientation:portrait){#rotate{display:grid}}
@media (prefers-reduced-motion:reduce){#track,#start,.badge-trigger{transition-duration:75ms!important}#character-image{animation-duration:75ms!important}}
</style>
</head>
<body>
<main id="home" class="screen">
 <button id="start" aria-label="启动 Pup Pad"><img src="images/badge/PawPatrolLogo.png" alt="Pup Pad"></button>
</main>
<main id="app" class="screen hidden" aria-label="左右滑动选择狗狗">
 <div id="viewport"><div id="track"></div></div>
</main>
<div id="character-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="角色展示">
 <button id="close-character" type="button" aria-label="返回徽章选择"><img id="character-image" src="" alt=""></button>
</div>
<div id="rotate"><div>📱 请将设备横过来</div></div>
<script>
(()=>{
"use strict";
const pups=[
 {key:"chase",name:"Chase",badge:"ChaseBadge.png",c:["#398cdd","#145cb3","#0a315e"]},
 {key:"marshall",name:"Marshall",badge:"MarshallBadge.png",c:["#ff6c65","#dd1e25","#721218"]},
 {key:"skye",name:"Skye",badge:"SkyBadge.png",c:["#ffa3d7","#e44b9d","#7b2c63"]},
 {key:"rubble",name:"Rubble",badge:"RubbleBadge.png",c:["#ffdf66","#efbb20","#7c590c"]},
 {key:"rocky",name:"Rocky",badge:"RockyBadge.png",c:["#86db70","#22a148","#10532c"]},
 {key:"zuma",name:"Zuma",badge:"ZumaBadge.png",c:["#ffb96a","#ee842b","#86431b"]}
];
const home=document.getElementById("home"),app=document.getElementById("app"),start=document.getElementById("start"),track=document.getElementById("track"),viewport=document.getElementById("viewport"),characterOverlay=document.getElementById("character-overlay"),characterImage=document.getElementById("character-image"),closeCharacter=document.getElementById("close-character");
const realCount=pups.length;
// A middle lap is always available; short or vigorous flicks can cross multiple pups.
const visible=[...pups,...pups,...pups];
track.innerHTML=visible.map(p=>'<section class="slide" role="group" aria-label="'+p.name+'" style="--light:'+p.c[0]+';--base:'+p.c[1]+';--dark:'+p.c[2]+'"><button type="button" class="badge-trigger" data-pup="'+p.key+'" aria-label="选择 '+p.name+'"><img alt="'+p.name+' badge" draggable="false" src="images/badge/'+p.badge+'"></button></section>').join("");
let index=realCount,dragging=false,animating=false,locked=false,startX=0,startY=0,baseX=0,lastX=0,lastTime=0,velocity=0,pointerId=null,transitionFallback=null,samples=[];
let pressedBadge=null,movedBeyondTap=false,pointerStartedAt=0,overlayOpen=false,overlayReadyAt=0,revealTimer=null,lastBadgeFocus=null;
const player=new Audio();
player.preload="auto";
let soundState="idle";
function stopSound(){
 soundState="idle";
 player.pause();
 try{player.currentTime=0;}catch{}
}
function playSound(src,state){
 stopSound();
 soundState=state;
 player.src=src;
 player.play().catch(()=>{if(soundState===state)soundState="idle";});
}
player.addEventListener("ended",()=>{soundState="idle";});
function showCharacter(key,badgeButton){
 if(overlayOpen||revealTimer!==null)return;
 const pup=pups.find(p=>p.key===key);
 if(!pup)return;
 // Begin playback in the user's activation, before the short reveal delay.
 playSound("audio/"+pup.key+"-audio.wav","character");
 lastBadgeFocus=badgeButton||null;
 characterImage.src="images/characters/"+pup.key+".png";
 characterImage.alt=pup.name;
 index=canonical(index);
 move(pos());
 syncFrame();
 // Virtual carousel duplicates share the same artwork. Focus and align the
 // canonical middle-lap badge even if the tap originated from another lap.
 lastBadgeFocus=track.querySelectorAll(".badge-trigger")[index]||badgeButton||null;
 revealTimer=setTimeout(()=>{
   revealTimer=null;
   if(pressedBadge){pressedBadge.classList.remove("pressed");pressedBadge=null;}
   characterOverlay.classList.remove("hidden");
   document.documentElement.classList.add("character-open");
   overlayOpen=true;
   alignCharacterToBadge();
   if(lastBadgeFocus)lastBadgeFocus.classList.add("preview-hidden");
   overlayReadyAt=performance.now()+280; // Ignore synthetic click from opening tap.
   closeCharacter.focus({preventScroll:true});
 },140);
}
function alignCharacterToBadge(){
 // Measure *after* opening the hidden overlay so its actual tablet overscan
 // and the selected badge's actual onscreen center are both accounted for.
 if(!lastBadgeFocus)return;
 const badgeRect=lastBadgeFocus.getBoundingClientRect();
 const overlayRect=closeCharacter.getBoundingClientRect();
 const dx=badgeRect.left+badgeRect.width/2-overlayRect.left-overlayRect.width/2;
 const dy=badgeRect.top+badgeRect.height/2-overlayRect.top-overlayRect.height/2;
 characterImage.style.setProperty("--badge-dx",dx.toFixed(2)+"px");
 characterImage.style.setProperty("--badge-dy",dy.toFixed(2)+"px");
}
function dismissCharacter(){
 if(!overlayOpen||performance.now()<overlayReadyAt)return;
 overlayOpen=false;
 characterOverlay.classList.add("hidden");
 document.documentElement.classList.remove("character-open");
 stopSound();
 if(lastBadgeFocus){
   lastBadgeFocus.classList.remove("preview-hidden");
   lastBadgeFocus.focus({preventScroll:true});
 }
}
closeCharacter.addEventListener("click",dismissCharacter);
track.addEventListener("click",e=>{
 // Pointer activation is handled separately on pointerup to exclude swipes.
 if(e.detail!==0||overlayOpen||revealTimer!==null)return;
 const badge=e.target.closest(".badge-trigger");
 if(badge)showCharacter(badge.dataset.pup,badge);
});
const canonical=i=>realCount+((i%realCount)+realCount)%realCount;
const limit=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
/* The document canvas can remain visible beneath a standalone tablet viewport.
   Match that exposed strip to the exact two panels currently crossing the screen. */
let bleedFrame=0;
const w=()=>viewport.clientWidth||innerWidth;
const pos=()=>-index*w();
function paintBleed(px){
 const width=w();
 if(!width)return;
 const offset=Math.max(0,Math.min(visible.length-1,-px/width));
 const left=Math.floor(offset),right=Math.min(left+1,visible.length-1);
 const progress=offset-left;
 const root=document.documentElement;
 const patternSize=parseFloat(getComputedStyle(root).getPropertyValue('--pattern-size'))||256;
 const phase=(px+left*width-width*.1)%patternSize;
 const phaseY=(-(viewport.clientHeight||innerHeight)*.1)%patternSize;
 root.style.setProperty('--bleed-left',visible[left].c[2]);
 root.style.setProperty('--bleed-right',visible[right].c[2]);
 root.style.setProperty('--bleed-split',((1-progress)*100).toFixed(3)+'%');
 root.style.setProperty('--bleed-pattern-x',phase.toFixed(2)+'px');
 root.style.setProperty('--bleed-pattern-y',phaseY.toFixed(2)+'px');
}
function trackOffset(){
 const value=getComputedStyle(track).transform;
 return value&&value!=='none'?new DOMMatrixReadOnly(value).m41:pos();
}
function stopBleed(){
 if(bleedFrame){cancelAnimationFrame(bleedFrame);bleedFrame=0;}
}
function tickBleed(){
 bleedFrame=0;
 paintBleed(trackOffset());
 if(animating)bleedFrame=requestAnimationFrame(tickBleed);
}
function syncFrame(){paintBleed(pos());}
function move(px,animate=false,duration=340){
 clearTimeout(transitionFallback);
 track.style.transition=animate?'transform '+duration+'ms var(--swipe-ease)':'none';
 track.style.transform='translate3d('+px+'px,0,0)';
 if(animate){
   animating=true;
   if(!bleedFrame)bleedFrame=requestAnimationFrame(tickBleed);
   transitionFallback=setTimeout(complete,duration+80);
 }else{
   animating=false;
   stopBleed();
   paintBleed(px);
 }
}
function complete(){
 clearTimeout(transitionFallback);
 animating=false;
 stopBleed();
 const normalized=canonical(index);
 if(normalized!==index){index=normalized;move(pos());}
 syncFrame();
}
track.addEventListener("transitionend",e=>{if(e.target===track&&e.propertyName==="transform")complete();});
start.addEventListener("click",()=>{
 if(locked)return;
 locked=true;start.classList.add("pressed");
 playSound("audio/Ryder%20needs%20us.mp3","intro");
 setTimeout(()=>{home.classList.add("hidden");app.classList.remove("hidden");index=realCount;move(pos());syncFrame();},230);
});
function down(e){
 if(app.classList.contains("hidden")||dragging||overlayOpen||revealTimer!==null||(!e.isPrimary&&e.pointerType!=="mouse"))return;
 pressedBadge=e.target.closest(".badge-trigger");
 movedBeyondTap=false;
 pointerStartedAt=performance.now();
 startY=e.clientY||0;
 if(pressedBadge)pressedBadge.classList.add("pressed");
 if(animating){
   // Interrupt an active settle without jumping: the three laps are identical.
   const matrix=getComputedStyle(track).transform;
   const observed=matrix&&matrix!=="none"?new DOMMatrixReadOnly(matrix).m41:pos();
   clearTimeout(transitionFallback);
   const virtual=Math.round(-observed/w());
   index=canonical(virtual);
   baseX=observed+(virtual-index)*w();
   track.style.transition="none";
   track.style.transform="translate3d("+baseX+"px,0,0)";
   animating=false;
   stopBleed();
   paintBleed(baseX);
 }else baseX=pos();
 dragging=true;pointerId=e.pointerId;
 startX=lastX=e.clientX;
 lastTime=performance.now();velocity=0;
 samples=[{x:e.clientX,t:lastTime}];
 try{viewport.setPointerCapture(pointerId);}catch{}
}
function sample(x){
 const now=performance.now();
 samples.push({x,t:now});
 while(samples.length>2&&now-samples[0].t>110)samples.shift();
 const old=samples[0],dt=now-old.t;
 velocity=dt>=12?limit((x-old.x)/dt,-4,4):0;
 lastX=x;lastTime=now;
}
function drag(e){
 if(!dragging||e.pointerId!==pointerId)return;
 sample(e.clientX);
 if(Math.abs(e.clientX-startX)>14||Math.abs((e.clientY||0)-startY)>14){
   movedBeyondTap=true;
   if(pressedBadge)pressedBadge.classList.remove("pressed");
 }
 // Track the finger across multiple screens while keeping the virtual track in bounds.
 const dx=limit((e.clientX-startX)*.96,-3*w(),3*w());
 move(baseX+dx);
}
function end(e,cancelled=false){
 if(!dragging||e.pointerId!==pointerId)return;
 dragging=false;
 sample(e.clientX);
 const dx=lastX-startX;
 const tapped=!cancelled&&pressedBadge&&!movedBeyondTap&&Math.abs(dx)<=14&&Math.abs((e.clientY||0)-startY)<=14&&performance.now()-pointerStartedAt<650;
 if(tapped){
   const selectedBadge=pressedBadge;
   pressedBadge=null;
   showCharacter(selectedBadge.dataset.pup,selectedBadge);
   setTimeout(()=>selectedBadge.classList.remove("pressed"),180);
   return;
 }
 if(pressedBadge){pressedBadge.classList.remove("pressed");pressedBadge=null;}
 if(cancelled){
   index=limit(Math.round(-(baseX+dx*.96)/w()),0,visible.length-1);
 }else{
   const projected=dx+velocity*560; // short, speed-dependent inertia in px
   const deliberate=Math.abs(dx)>w()*.17||(Math.abs(velocity)>.50&&Math.abs(dx)>24);
   if(deliberate){
     const pages=limit(Math.max(1,Math.round(Math.abs(projected)/w())),1,3);
     index=limit(index+(projected<0?pages:-pages),0,visible.length-1);
   }
 }
 const distance=Math.abs(-index*w()-(baseX+dx*.96));
 if(distance<.5){move(pos());complete();return;}
 const duration=Math.round(limit(280+distance/w()*115-Math.abs(velocity)*32,250,620));
 move(pos(),true,duration);
}
viewport.addEventListener("pointerdown",down);
viewport.addEventListener("pointermove",drag);
viewport.addEventListener("pointerup",e=>end(e));
viewport.addEventListener("pointercancel",e=>end(e,true));
viewport.addEventListener("lostpointercapture",e=>end(e,true));
addEventListener("resize",()=>{
 clearTimeout(transitionFallback);animating=false;dragging=false;
 index=canonical(index);
 move(pos());
 syncFrame();
 if(overlayOpen)requestAnimationFrame(alignCharacterToBadge);
});
addEventListener("keydown",e=>{
 if(overlayOpen){
   if(e.key==="Escape"){overlayReadyAt=0;dismissCharacter();}
   return;
 }
 if(app.classList.contains("hidden")||dragging||revealTimer!==null)return;
 if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
 if(animating)complete();
 index+=(e.key==="ArrowRight"?1:-1);
 move(pos(),true,300);
});
})();
</script>
</body>
</html>
